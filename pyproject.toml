[project]
name = "funpay-tg-bot"
version = "1.0.0"
description = "Telegram bot that automates Steam account sales on FunPay: chat forwarding, review requests and automatic lot restocking."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20",
    "aiohttp>=3.10",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "cryptography>=44.0",
    "lxml>=5.3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Buyer-facing strings are intentionally in Russian (Cyrillic look-alike characters).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
